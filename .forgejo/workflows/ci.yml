name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hassfest:
    # image-builder is the only runner with the docker socket mounted;
    # home-assistant/actions/hassfest runs hassfest inside a docker container.
    # infra #98/#182 pattern; infra #220 for the DEFAULT_ACTIONS_URL context.
    runs-on: image-builder
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        env:
          # HACS action calls github.com to verify the public mirror
          # (github.com/timmikk/ha-ulkovalot). Forgejo's built-in
          # secrets.GITHUB_TOKEN is Forgejo-scoped and returns 401 for
          # github.com API calls, so pass a real PAT via a repo secret.
          # HACS_GITHUB_TOKEN mirrors infra vault_github_mirror_token
          # (contents: read on all timmikk/ha-* mirrors). See infra #220.
          GITHUB_TOKEN: ${{ secrets.HACS_GITHUB_TOKEN }}
        with:
          category: integration
          ignore: brands

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py3.12-${{ hashFiles('requirements_test.txt') }}
          restore-keys: uv-${{ runner.os }}-py3.12-
      - run: pip install uv
      - run: uv pip install --system -r requirements_test.txt
      - run: |
          pytest -q --cov=custom_components/ulkovalot --cov-branch \
            --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v3
        with:
          name: coverage-xml
          path: coverage.xml

  sonar:
    runs-on: ubuntu-latest
    needs: [pytest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v3
        with:
          name: coverage-xml
      - name: Install sonar-scanner
        run: |
          apt-get update -qq && apt-get install -y -qq unzip > /dev/null 2>&1
          curl -sL "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip" -o /tmp/sonar.zip
          unzip -q /tmp/sonar.zip -d /opt
          ln -s /opt/sonar-scanner-6.2.1.4610-linux-x64/bin/sonar-scanner /usr/local/bin/sonar-scanner
          rm /tmp/sonar.zip
      - name: SonarQube analysis
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: sonar-scanner
