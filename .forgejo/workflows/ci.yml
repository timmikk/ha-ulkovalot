name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hassfest:
    # home-assistant/actions/hassfest is a Dockerfile action: it mounts
    # $GITHUB_WORKSPACE into the container. On Forgejo Actions the docker CLI
    # inside the job container talks to the *host* daemon (socket mount from
    # image-builder), so the mount references a path that doesn't exist on
    # the host and the container reports "No integrations found". Run
    # hassfest as a Python module against a shallow HA core clone instead —
    # no docker, no image-builder. Infra task #222.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve latest homeassistant version
        # Queried up front (before installing/cloning anything) so both
        # heavy steps below can be cached by version and skipped entirely
        # on cache hit, instead of only caching pip's download cache.
        run: |
          HA_VERSION=$(curl -sS https://pypi.org/pypi/homeassistant/json | python -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
          echo "HA_VERSION=$HA_VERSION" >>"$GITHUB_ENV"
      - name: Cache hassfest venv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: ~/hassfest-venv
          key: hassfest-venv-${{ runner.os }}-py3.13-${{ env.HA_VERSION }}-v1
      - name: Cache ha-core clone
        id: core-cache
        uses: actions/cache@v4
        with:
          path: /tmp/ha-core
          key: hassfest-core-${{ env.HA_VERSION }}-v1
      - name: Install homeassistant
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/hassfest-venv
          source ~/hassfest-venv/bin/activate
          python -m pip install --upgrade pip
          # tqdm + ruff are script-only deps of hassfest that aren't
          # pulled in by the homeassistant runtime package.
          # (--requirements is dropped from the invocation below because
          # its transitive dependency chain — pipdeptree, pip-tools, etc.
          # — is not worth reconstructing for a manifest with no external
          # requirements.)
          python -m pip install "homeassistant==$HA_VERSION" tqdm ruff
      - name: Fetch matching core
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf /tmp/ha-core
          # Clone core at the tag matching the pip-installed package so
          # script.hassfest lines up with the runtime it validates against.
          # master can outpace the released package and introduce Python
          # incompatibilities (e.g. self-referencing class annotations).
          git clone --depth 1 --branch "$HA_VERSION" \
            https://github.com/home-assistant/core /tmp/ha-core
      - name: Run hassfest
        run: |
          source ~/hassfest-venv/bin/activate
          cd /tmp/ha-core
          python -m script.hassfest \
            --integration-path "$GITHUB_WORKSPACE/custom_components/ulkovalot" \
            --action validate

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          # hacs/action reads its token from the `github_token` *input*
          # (container env INPUT_GITHUB_TOKEN), not a step-level
          # GITHUB_TOKEN env var — that env var is never read by the
          # container at all. Unset, it defaults to `${{ github.token }}`,
          # Forgejo's own instance-scoped ephemeral token, which
          # api.github.com rejects with 401 (confirmed via a diagnostic
          # probe: the same PAT passed as a plain env var authenticates
          # fine against api.github.com/user, but the action itself still
          # 401s until wired through this input). See infra #223.
          #
          # `repository` also needs pinning: `github.repository` resolves
          # to the *Forgejo* repo (timo/ha-ulkovalot), not the GitHub
          # mirror HACS actually needs to validate (timmikk/ha-ulkovalot).
          github_token: ${{ secrets.HACS_GITHUB_TOKEN }}
          repository: timmikk/ha-ulkovalot
          category: integration
          ignore: brands

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py3.12-${{ hashFiles('requirements_test.txt') }}
          restore-keys: uv-${{ runner.os }}-py3.12-
      - run: pip install uv
      - run: uv pip install --system -r requirements_test.txt
      - run: |
          pytest -q --cov=custom_components/ulkovalot --cov-branch \
            --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v3
        with:
          name: coverage-xml
          path: coverage.xml

  sonar:
    runs-on: ubuntu-latest
    needs: [pytest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v3
        with:
          name: coverage-xml
      - name: Install sonar-scanner
        run: |
          apt-get update -qq && apt-get install -y -qq unzip > /dev/null 2>&1
          curl -sL "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip" -o /tmp/sonar.zip
          unzip -q /tmp/sonar.zip -d /opt
          ln -s /opt/sonar-scanner-6.2.1.4610-linux-x64/bin/sonar-scanner /usr/local/bin/sonar-scanner
          rm /tmp/sonar.zip
      - name: SonarQube analysis
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: sonar-scanner
